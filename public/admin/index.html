<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>后台管理 — 欲蓝财务</title>
<meta name="theme-color" content="#f5f6f8">
<link rel="stylesheet" href="../assets/style.css?v=20261122a">
<link rel="stylesheet" href="../api/theme.css">
<link rel="stylesheet" href="assets/admin.css?v=20261122a">
</head>
<body>

<div class="admin">

  <!-- ---------- 侧栏 ---------- -->
  <aside class="side">
    <div class="side__brand">
      <b>欲蓝财务</b>
      <span>Admin</span>
    </div>

    <div class="side__group">概览</div>
    <button class="side__link" data-view="dashboard" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 8h6V4h-6z"/></svg>
      数据概览
    </button>

    <div class="side__group">商品</div>
    <button class="side__link" data-view="products" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.4L12 4l8 4.4v7.2L12 20l-8-4.4z"/><path d="M4 8.4l8 4.4 8-4.4M12 12.8V20"/></svg>
      商品管理
      <b id="nav-products">—</b>
    </button>
    <button class="side__link" data-view="categories" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      分类管理
    </button>

    <div class="side__group">交易</div>
    <button class="side__link" data-view="orders" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>
      订单管理
      <b id="nav-orders">—</b>
    </button>
    <button class="side__link" data-view="users" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.4 19c0-3 2.5-5 5.6-5s5.6 2 5.6 5"/><path d="M16 5.6a3 3 0 010 5.6M17.4 19c0-2.2-.8-3.8-2-4.8"/></svg>
      用户管理
    </button>
    <button class="side__link" data-view="tickets" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.6h16v4.2a2.2 2.2 0 000 4.4v4.2H4v-4.2a2.2 2.2 0 000-4.4z"/><path d="M12 9.2v5.6"/></svg>
      工单管理
      <b id="nav-tickets">—</b>
    </button>

    <div class="side__group">内容</div>
    <button class="side__link" data-view="reviews" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12.4c0 3.6-3.6 6.4-8 6.4-1 0-2-.1-2.9-.4L5 20l1.2-3.2C4.8 15.6 4 14.1 4 12.4 4 8.8 7.6 6 12 6s8 2.8 8 6.4z"/></svg>
      评价管理
      <b id="nav-reviews">—</b>
    </button>

    <div class="side__group">系统</div>
    <button class="side__link" data-view="site" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="16" r="2.4"/></svg>
      站点设置
    </button>
    <button class="side__link" data-view="extensions" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/><path d="M7.5 7.5h0M16.5 7.5h0M7.5 16.5h0"/></svg>
      主题与插件
    </button>
    <button class="side__link" data-view="shipping" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.6 7.2h11v9.6h-11zM13.6 10.4h4.2l3.6 3.4v3h-7.8z"/><circle cx="6.6" cy="18.2" r="1.6"/><circle cx="17.4" cy="18.2" r="1.6"/></svg>
      运费设置
    </button>
    <button class="side__link" data-view="virtual" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.6h16v12.8H4z"/><path d="M8 10h8M8 13.6h5M4 9.2h16"/></svg>
      虚拟商品发货
    </button>
    <button class="side__link" data-view="upstreams" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v4H4zM4 13.5h16v4H4z"/><path d="M7 8.5h0M7 15.5h0"/></svg>
      魔方财务 · 上游管理
    </button>
    <button class="side__link" data-view="cloudVms" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="6" width="17.2" height="12" rx="2"/><path d="M7 10h4M7 13h8M7 16h5"/></svg>
      魔方云 · 云主机
    </button>
    <button class="side__link" data-view="yulan" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4l8 4.2v8.8l-8 4.2-8-4.2V7.6z"/><path d="M12 12l8-4.2M12 12v8.4M12 12L4 7.8"/></svg>
      全局默认（兼容）
    </button>
    <button class="side__link" data-view="update" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v6M12 20v-6M4.9 4.9l3 3M19.1 19.1l-3-3"/><path d="M20 12a8 8 0 1 1-2.3-5.7"/></svg>
      在线更新
    </button>
    <button class="side__link" data-view="epay" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.6" y="5.6" width="18.8" height="12.8" rx="2"/><path d="M2.6 9.8h18.8M6.6 14.6h4"/></svg>
      易支付配置
    </button>
    <!-- v1.2.2 功能插件菜单（邮件配置 / 多账号）由插件 JS 动态注入到此组 -->
    <button class="side__link" data-view="settings" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3.6v2M12 18.4v2M3.6 12h2M18.4 12h2M6.1 6.1l1.4 1.4M16.5 16.5l1.4 1.4M17.9 6.1l-1.4 1.4M7.5 16.5l-1.4 1.4"/></svg>
      账号与设置
    </button>
    <button class="side__link" data-view="audit" type="button" id="nav-audit-link" hidden>
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8 10h8M8 14h6"/></svg>
      操作日志
    </button>

    <div class="side__spacer"></div>

    <div class="side__user">
      <b id="me-name">—</b>
      <span id="me-role">—</span>
    </div>
    <button class="side__link" id="btn-logout" type="button">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8V5H5v14h9v-3"/><path d="M10 12h10M17 9l3 3-3 3"/></svg>
      退出登录
    </button>
  </aside>

  <!-- ---------- 主区 ---------- -->
  <div class="main">
    <div class="topbar">
      <h1 id="view-title">数据概览</h1>
      <span class="topbar__spacer"></span>
      <span class="topbar__hint" id="topbar-hint"></span>
      <button class="icon-btn" data-theme-toggle type="button" aria-label="切换主题"></button>
      <a class="btn btn--sm btn--ghost" href="../index.html" target="_blank" rel="noopener">查看前台</a>
    </div>

    <div class="view" id="view"></div>
  </div>
</div>

<!-- 抽屉（商品编辑 / 订单详情 / 分类编辑 / 评价编辑） -->
<div class="drawer-mask" id="drawer-mask"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" tabindex="-1">
  <div class="drawer__head">
    <h2 id="drawer-title">—</h2>
    <span class="spacer"></span>
    <button class="icon-btn" id="drawer-close" type="button" aria-label="关闭">
      <svg class="ico ico--lg" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>
  </div>
  <div class="drawer__body" id="drawer-body"></div>
  <div class="drawer__foot" id="drawer-foot"></div>
</aside>

<div class="toast-zone" id="toast-zone" aria-live="polite"></div>

<script src="assets/api.js?v=20261122a"></script>
<script src="assets/views.js?v=20261122a"></script>
<script src="assets/views-v5.js?v=20261122a"></script>
<script src="assets/views-v140.js?v=20261122a"></script>
<script src="assets/app.js?v=20261122a"></script>
</body>
</html>
