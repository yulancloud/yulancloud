<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0052d9">
<title>登录 / 注册 · 欲蓝财务</title>
<link rel="stylesheet" href="assets/innovative.css?v=20261128a">
</head>
<body class="innovative">
<div class="iv-auth">
  <div class="iv-auth__box">
    <!-- 左侧品牌（智简魔方 regist.php 风格） -->
    <div class="iv-auth__brand">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:40px">
        <span class="iv-brand__logo" data-brand-mark style="width:42px;height:42px;font-size:20px">欲</span>
        <span style="font-size:20px;font-weight:700" data-site-name>欲蓝财务</span>
      </div>
      <h1>欢迎使用<br>欲蓝财务魔方</h1>
      <p>一个账号，管理你的云服务器、财务服务与订单。<br>稳定、安全、自动化——让业务增长更简单。</p>
      <div style="margin-top:auto;font-size:13px;color:#9fc0ea;position:relative;z-index:2">
        <span data-brand-primary>欲蓝财务魔方</span> · <span data-brand-secondary>魔方财务</span> 双服务支持
      </div>
    </div>

    <!-- 右侧表单 -->
    <div class="iv-auth__form">
      <h2 id="ivAuthTitle">登录账号</h2>
      <p class="iv-muted" id="ivAuthSub">欢迎回来，请输入账号信息</p>
      <div class="iv-auth__tabs">
        <div class="iv-auth__tab is-active" id="tabLogin" onclick="switchTab('login')">登录</div>
        <div class="iv-auth__tab" id="tabReg" onclick="switchTab('reg')">注册</div>
      </div>

      <form id="ivLoginForm">
        <div class="iv-field"><label>邮箱 / 账号</label><input id="lfUser" autocomplete="username" placeholder="请输入邮箱或账号"></div>
        <div class="iv-field"><label>密码</label><input id="lfPass" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
        <div class="iv-field" id="lfCodeWrap" style="display:none">
          <label>邮箱验证码</label>
          <div class="iv-auth__code">
            <input id="lfCode" placeholder="6 位验证码" inputmode="numeric">
            <button type="button" class="iv-btn iv-btn--light iv-btn--sm" id="lfSendCode" onclick="sendCode()">获取验证码</button>
          </div>
          <div class="iv-hint" id="lfCodeHint"></div>
        </div>
        <button class="iv-btn iv-btn--primary iv-btn--block" type="submit" id="ivSubmit" style="height:44px;margin-top:8px">登录</button>
      </form>
      <p class="iv-hint" style="text-align:center;margin-top:18px">
        <a class="iv-link" href="index.html">返回首页</a>
      </p>
    </div>
  </div>
</div>
<div class="iv-toast-wrap" id="ivToast"></div>

<script>
(function () {
  'use strict';
  var API = (function () {
    var base = document.querySelector('meta[name="shop-api-base"]')?.content || '';
    return base || (location.pathname.replace(/\/innovative\/.*$/, '') + '/api');
  })();
  var mode = 'login';

  function req(method, path, body) {
    var opt = { method: method, headers: {} };
    if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    return fetch(API + path, opt).then(function (r) { return r.text().then(function (t) {
      var j = null; try { j = JSON.parse(t); } catch (e) {}
      if (!r.ok || !j || !j.ok) { var e2 = new Error((j && j.error && j.error.message) || ('HTTP ' + r.status)); e2.code = j && j.error && j.error.code; throw e2; }
      return j.data;
    }); });
  }
  function toast(msg, err) {
    var d = document.createElement('div'); d.className = 'iv-toast' + (err ? ' iv-toast--err' : '');
    d.textContent = msg; document.getElementById('ivToast').appendChild(d); setTimeout(function(){d.remove();}, 2800);
  }
  function txt(sel, v) { var el = document.querySelector(sel); if (el && v) el.textContent = v; }

  req('GET', '/site').then(function (s) {
    txt('[data-site-name]', s.site_name);
    txt('[data-brand-primary]', s.brand_primary);
    txt('[data-brand-secondary]', s.brand_secondary);
    var mark = document.querySelector('[data-brand-mark]'); if (mark && s.site_name) mark.textContent = s.site_name.charAt(0);
  }).catch(function () {});

  window.switchTab = function (m) {
    mode = m;
    document.getElementById('tabLogin').classList.toggle('is-active', m === 'login');
    document.getElementById('tabReg').classList.toggle('is-active', m === 'reg');
    document.getElementById('ivAuthTitle').textContent = m === 'login' ? '登录账号' : '注册新账号';
    document.getElementById('ivAuthSub').textContent = m === 'login' ? '欢迎回来，请输入账号信息' : '创建账号，开始使用我们的服务';
    document.getElementById('ivSubmit').textContent = m === 'login' ? '登录' : '注册并登录';
    document.getElementById('lfCodeWrap').style.display = m === 'reg' ? '' : 'none';
    document.getElementById('lfPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  };

  var codeLeft = 0, codeTimer = null;
  window.sendCode = function () {
    var u = document.getElementById('lfUser').value.trim();
    if (!u || u.indexOf('@') < 0) { toast('请先填写邮箱', true); return; }
    // 验证码端点由 SMTP 登录插件提供；未安装插件时该端点不存在，给出可操作提示。
    req('POST', '/console/register/send-code', { email: u, scene: 'register' }).then(function () {
      toast('验证码已发送'); codeLeft = 60;
      var btn = document.getElementById('lfSendCode'); btn.disabled = true;
      clearInterval(codeTimer);
      codeTimer = setInterval(function () {
        btn.textContent = codeLeft + 's'; codeLeft--;
        if (codeLeft <= 0) { clearInterval(codeTimer); btn.disabled = false; btn.textContent = '重新获取'; }
      }, 1000);
    }).catch(function (e) {
      if (e.code === 'api_not_routed' || /404/.test(e.message)) {
        toast('验证码功能需先安装 SMTP 邮箱插件，当前可直接注册', true);
      } else {
        toast('发送失败：' + e.message, true);
      }
    });
  };

  document.getElementById('ivLoginForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = document.getElementById('lfUser').value.trim();
    var p = document.getElementById('lfPass').value;
    if (!u || !p) { toast('请填写账号和密码', true); return; }
    var btn = document.getElementById('ivSubmit'); btn.disabled = true;
    var path = mode === 'login' ? '/console/login' : '/console/register';
    var body = { username: u, password: p };
    if (mode === 'reg') {
      body.email = u;
      body.display_name = u.split('@')[0];
      var c = document.getElementById('lfCode').value.trim();
      if (c) body.code = c;
    }
    req('POST', path, body).then(function () {
      toast(mode === 'login' ? '登录成功' : '注册成功');
      setTimeout(function () { location.href = 'console.html'; }, 400);
    }).catch(function (e) {
      // 若注册端要求验证码而本端未支持，给出可操作提示
      var msg = e.message || '操作失败';
      if (e.code === 'code_required') { document.getElementById('lfCodeWrap').style.display = ''; msg = '请先获取并填写邮箱验证码'; }
      toast(msg, true); btn.disabled = false;
    });
  });

  // 已登录直接进控制台
  req('GET', '/console/me').then(function () { location.replace('console.html'); }).catch(function () {});
})();
</script>
</body>
</html>
