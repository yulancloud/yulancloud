# =============================================================================
# Nginx 配置 —— 子目录部署（站点挂在 https://example.com/shop/）
#
# 这是「点下单弹 404」最容易踩的坑：
#   前端在 /shop/ 下，如果接口基址写死成 /api/orders，请求会打到
#   https://example.com/api/orders —— 而接口实际在 /shop/api/orders，
#   于是 404。本配置 + 前端 api.js 的自动探测一起解决这个问题。
#
# 两处必须同时正确：
#   1. 本文件的 location /shop/ 前缀（把 /shop/api/* 转发到 /shop/api/index.php）
#   2. 前端 api.js 的 detectApiBase()（从 /shop/cart.html 推出 /shop/api）
#
# -----------------------------------------------------------------------------
# ⚠️ v5.5 修复（与 nginx-root.conf 同源的源码泄露问题）
#
# 旧配置：
#     location ^~ /shop/api/ {
#         try_files $uri /api/index.php$is_args$args;
#     }
# 两个致命后果：
#   1) `location ^~` 是「前缀匹配且命中后不再尝试正则」，优先级高于
#      `location ~ \.php$`。于是 /shop/api/index.php 被 ^~ 抢走，
#      try_files 的第一个参数 $uri 命中磁盘上真实存在的 PHP 文件，
#      **直接静态返回 PHP 源码**（整站配置、密钥全泄露）。
#   2) 普通接口（/shop/api/health）走 try_files 内部重定向到 /api/index.php，
#      重定向后丢掉 /shop 前缀，落到 server 级 location / { return 404; }，
#      所有 /shop/api/* 统统 404。
#
# 修复：整个 /shop/api/ 前缀无条件 fastcgi_pass，入口固定为 api/index.php，
#       不再用 try_files 做静态兜底；同时保留「其余 .php 一律 404」的闸门。
# -----------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    charset utf-8;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---------- 子目录：/shop/ ----------
    location ^~ /shop/ {

        # ⚠️ 指向 public/，且 alias 末尾必须带斜杠
        alias /var/www/shop-php/public/;
        index index.html index.php;

        # 敏感文件：一律 404
        location ~* \.(sqlite|sqlite3|db|db3|sql|sqlitedb|log|ini|env|bak|backup|old|orig|swp|swo|tmp|tar|tgz|gz|bz2|xz|zip|rar|7z|yml|yaml|lock)$ {
            return 404;
        }
        location ~ /\.(env|git|svn|hg|htaccess|htpasswd|DS_Store) {
            return 404;
        }
        location ~* ^/shop/(data|config|database|src|bin|deploy|vendor|node_modules)/ {
            return 404;
        }

        # ---------- API：核心规则 ----------
        # /shop/api/health → 固定交给 /var/www/shop-php/public/api/index.php
        # 注意 alias 场景下 $document_root 不可靠，SCRIPT_FILENAME 用绝对路径写死，
        # 部署时与上面的 alias 一起改成你的真实路径。
        # 绝不能改回 try_files $uri ...：$uri 命中真实 .php 文件就会返回源码。
        location ^~ /shop/api/ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/shop-php/public/api/index.php;
            fastcgi_param SCRIPT_NAME     /shop/api/index.php;
            fastcgi_param DOCUMENT_URI    /shop/api/index.php;
            fastcgi_param DOCUMENT_ROOT   /var/www/shop-php/public;
            fastcgi_param REQUEST_URI     $request_uri;
            # ⚠️ 按你实际安装的 PHP 版本改这一行
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_read_timeout 60s;
        }

        # ---------- 安装向导 ----------
        location = /shop/install {
            try_files /install.html =404;
        }
        location = /shop/install/ {
            try_files /install.html =404;
        }

        # ---------- 后台 ----------
        location = /shop/admin {
            return 301 /shop/admin/;
        }
        location ^~ /shop/admin/ {
            try_files $uri $uri/ /admin/index.html =404;
        }

        # ---------- 用户中心 ----------
        location = /shop/console {
            return 301 /shop/console/;
        }
        location ^~ /shop/console/ {
            try_files $uri $uri/ /console/index.html =404;
        }

        # ---------- PHP ----------
        # 只放行 router.php；其余 .php（含 /api/ 下的、src/ bin/ 里的）一律 404。
        # /shop/api/* 已在上面的 ^~ 里处理，不会走到这里。
        location ~ \.php$ {
            location ~ ^/shop/router\.php$ {
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
                fastcgi_param REQUEST_URI     $request_uri;
                fastcgi_pass unix:/run/php/php8.5-fpm.sock;
                fastcgi_read_timeout 30s;
            }
            return 404;
        }

        # ---------- 静态资源 ----------
        location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|ico)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }

        # ---------- v1.2 插件目录：不存在就 404，不回首页 ----------
        location /shop/plugins/ {
            try_files $uri $uri/ =404;
        }

        # ---------- 页面 ----------
        location /shop/ {
            try_files $uri $uri/ /index.html =404;
        }
    }

    # 根路径重定向到子目录（可选）
    location = / {
        return 302 /shop/;
    }

    location / {
        return 404;
    }
}

# =============================================================================
# 子目录部署检查清单
#
# 1. 前端接口基址
#    api.js 会自动从 /shop/cart.html 推出 /shop/api，无需改代码。
#    若你的目录结构特殊，可在页面 <head> 里显式指定：
#      <meta name="shop-api-base" content="/shop/api">
#    或在引入 api.js 之前：
#      <script>window.SHOP_API_BASE = '/shop/api';</script>
#
# 2. 验证命令（部署后必跑）
#      curl -i https://example.com/shop/api/health
#      → 应返回 200 与 {"ok":true,...}，Content-Type: application/json
#      curl -i https://example.com/shop/api/index.php
#      → 应返回 JSON 入口结果，**绝不能**出现 "<?php" 源码
#      curl -i -X POST https://example.com/shop/api/orders \
#           -H 'Content-Type: application/json' -d '{}'
#      → 应返回 400/422（参数错误），而不是 404
#
# 3. 若 /shop/api/health 返回 404 或 PHP 源码
#    - 确认 location ^~ /shop/api/ 内是 fastcgi_pass，不是 try_files
#    - 确认 SCRIPT_FILENAME 绝对路径与 alias 指向的 public/ 一致
#    - nginx -t && systemctl reload nginx
# =============================================================================
