# =============================================================================
# 拾物集商城 · Nginx 站点配置（站点根目录 = 项目里的 public/）
#
# 适用：站点根目录 = 项目里的 public/ 目录
#       PHP-FPM 8.5（如用 8.1/8.2/8.3/8.4，把下面 sock 路径里的版本号改掉即可）
#
# -----------------------------------------------------------------------------
# ⚠️ 线上故障根因（2026-11-14 实测确认，v5.5 修复）
#
# 现象：https://pay.chengbuwan.com/api/install/status 返回 HTTP 200，
#       但 Content-Type 是 application/octet-stream，响应体是 **PHP 源码本身**
#       （`<?php /** HTTP 路由入口 ...`，43705 字节，带 etag/last-modified）。
#       安装页因此 JSON.parse 失败，提示「无法读取安装状态」；
#       /console 与 /admin 的接口全部拿不到 JSON，前端统一显示「服务器返回异常」。
#
# 根因：Nginx 的 location 匹配优先级。
#       `location ^~ /api/` 是「前缀匹配 + 命中后不再尝试正则」，
#       它的优先级**高于** `location ~ \.php$` 这个正则。
#       于是 /api/index.php 被 ^~ /api/ 抢走，走 try_files 当成**静态文件**返回，
#       PHP-FPM 根本没被调用 → 源码被当文件下载。
#
#       旧配置里 ^~ /api/ 的 try_files 是：
#           try_files $uri $uri/ /api/index.php$is_args$args;
#       $uri = /api/index.php 在磁盘上**真实存在**，第一个参数就命中，
#       直接静态返回该文件 → 源码泄露。
#
# 修复：/api/ 前缀下**直接 fastcgi_pass**，不再走 try_files 静态兜底。
#       同时把 .php 的规则改成「先放行入口，再拒绝其余」，
#       并显式禁止把 .php 当静态文件返回（这是源码泄露的最后一道闸）。
# -----------------------------------------------------------------------------
#
# 部署步骤：
#   1. 把项目解压到 /www/wwwroot/pay.example.com（或任意目录）
#   2. 本文件放到 /etc/nginx/sites-available/shop.conf 并软链到 sites-enabled
#      （宝塔：网站 → 设置 → 配置文件，把 server{} 内容替换成本文件内容）
#   3. 把下面所有 /www/wwwroot/pay.example.com 改成你的真实路径
#   4. 把 pay.example.com 改成你的域名
#   5. 把 fastcgi_pass 的 php8.5-fpm.sock 改成你实际安装的 PHP 版本
#   6. nginx -t && systemctl reload nginx
#   7. 浏览器访问 /install 完成安装
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pay.example.com;

    # ---------- 站点根目录：必须是 public/，不是项目根目录 ----------
    # 写成项目根目录会导致 /api/index.php 变成 /public/api/index.php 找不到 → 404
    root /www/wwwroot/pay.example.com/public;
    index index.html index.php;

    charset utf-8;
    client_max_body_size 2m;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # =========================================================================
    # 【第一优先】API 入口：/api/ 前缀下直接交给 PHP-FPM
    #
    # 关键点：这里**不能**用 try_files 兜底到 /api/index.php。
    #   因为 /api/index.php 是磁盘上真实存在的文件，try_files 会把它当静态文件返回，
    #   结果就是「下载 PHP 源码」——这正是线上故障。
    #   正确做法：整个 /api/ 前缀无条件 fastcgi_pass 到 api/index.php，
    #   由 PHP 内部按 REQUEST_URI 分发（api/index.php 自己会解析路径）。
    # =========================================================================
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/index.php;
        fastcgi_param SCRIPT_NAME     /api/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_ROOT   $document_root;
        # ⚠️ 按你实际安装的 PHP 版本改这一行（8.5 / 8.4 / 8.3 / 8.2 / 8.1）
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # =========================================================================
    # 【第二优先】安装向导：/install 与 /install/ 都指向 install.html
    # =========================================================================
    location = /install {
        try_files /install.html =404;
    }
    location = /install/ {
        try_files /install.html =404;
    }

    # =========================================================================
    # 【第三优先】后台：/admin → /admin/ → admin/index.html
    # =========================================================================
    location = /admin {
        return 301 /admin/;
    }
    location ^~ /admin/ {
        try_files $uri $uri/ /admin/index.html =404;
    }

    # =========================================================================
    # 【第四优先】用户中心：/console → /console/ → console/index.html
    # =========================================================================
    location = /console {
        return 301 /console/;
    }
    location ^~ /console/ {
        try_files $uri $uri/ /console/index.html =404;
    }

    # =========================================================================
    # 【第五优先】PHP：只放行两个入口文件，其余 PHP 一律 404
    #
    # 注意：这一段是**正则** location，优先级低于上面的 ^~ 前缀，
    #       所以 /api/ 已经在上面的 ^~ 里被处理掉了，不会走到这里。
    #       这里只处理 /router.php 以及「误访问其他 .php」的情况。
    #       任何 .php 都不会被当静态文件返回 —— 源码泄露的最后一道闸。
    # =========================================================================
    location ~ \.php$ {
        # 只放行 router.php（PHP 内置服务器风格入口）与 api/index.php（兜底）
        location ~ ^/(router|api/index)\.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME     $fastcgi_script_name;
            fastcgi_param REQUEST_URI     $request_uri;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            # ⚠️ 按你实际安装的 PHP 版本改这一行
            fastcgi_pass unix:/run/php/php8.5-fpm.sock;
            fastcgi_read_timeout 60s;
        }
        # 其余 .php（含 src/、bin/、database/ 下的脚本）一律拒绝
        return 404;
    }

    # =========================================================================
    # 【安全】敏感文件与目录：一律 404
    # =========================================================================
    location ~* \.(sqlite|sqlite3|db|db3|sql|sqlitedb|log|ini|env|bak|backup|old|orig|swp|swo|tmp|tar|tgz|gz|bz2|xz|zip|rar|7z|yml|yaml|lock)$ {
        return 404;
    }
    location ~ /\.(env|git|svn|hg|htaccess|htpasswd|DS_Store) {
        return 404;
    }
    location ~* ^/(data|config|database|src|bin|deploy|vendor|node_modules)/ {
        return 404;
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(css|js|jpg|jpeg|png|gif|webp|svg|woff2?|ttf|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ---------- 页面兜底 ----------
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # ---------- 访问日志（排查 404/500 用）----------
    access_log /var/log/nginx/shop.access.log;
    error_log  /var/log/nginx/shop.error.log warn;
}

